id: n8n-core
repo: n8n-core
type: automation
version: 1

routines:
  - id: workflow-backup
    status: active
    frequency: weekly
    description: Backup/export workflows and verify restore path.
    guardrails:
      manual_confirmation: true
    commands: []

  - id: credentials-rotation-check
    status: proposed
    frequency: monthly
    description: Verify credential rotation posture (Notion/n8n inventory based).
    commands: []

  - id: dependency-audit
    status: proposed
    frequency: monthly
    description: Dependency checks if node/python modules exist.
    commands: []

